allowBuilds:
  # The prebuilt @esbuild/<platform> binary resolves without a postinstall
  # script (verified by running esbuild from this package), so the lifecycle
  # script stays disabled rather than granted.
  esbuild: false
minimumReleaseAgeExclude:
  - '@ai-sdk/openai-compatible@3.0.66'
  - '@ai-sdk/provider-utils@5.0.57'
  - '@ai-sdk/provider@4.0.25'
