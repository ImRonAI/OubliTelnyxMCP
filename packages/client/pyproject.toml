[project]
name="oubliai-client"
version="0.0.0"
requires-python=">=3.12"
dependencies=[
    "fastmcp==4.1.0",
    "fastmcp-tasks==4.1.0",
    "httpx2==2.13.1",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "cryptography>=43",
    "py-key-value-aio[filetree,wrappers-encryption]==0.4.6",
]

[project.optional-dependencies]
dev=["pytest>=8","pytest-asyncio>=0.24"]

[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
markers=["deno: requires the Deno runtime"]
