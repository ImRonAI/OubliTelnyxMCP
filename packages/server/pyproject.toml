[project]
name="oubliai-server"
version="0.0.0"
requires-python=">=3.12"
dependencies=["fastmcp[apps,code-mode,tasks]==4.1.0","mcp==2.3.0","prefab-ui==0.20.2","httpx2==2.13.1","fastmcp-tasks==4.1.0","py-key-value-aio[filetree,redis,wrappers-encryption]==0.4.6","deno==2.9.7"]

[project.optional-dependencies]
dev=["pytest>=8","pytest-asyncio>=0.24"]

[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
